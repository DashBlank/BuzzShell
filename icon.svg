<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing neon filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyberpunk background card -->
  <rect width="512" height="512" fill="#0c0c14"/>

  <!-- Outer highly detailed border -->
  <!-- Outer thin circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ff66" stroke-width="2" opacity="0.4" filter="url(#subtle-glow)" />
  <!-- Inner thick circle -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#00ff66" stroke-width="8" filter="url(#neon-glow)" />
  
  <!-- Tech tick marks around the border for high detail -->
  <g stroke="#00ff66" stroke-width="3" opacity="0.6">
    <line x1="256" y1="46" x2="256" y2="56" />
    <line x1="256" y1="456" x2="256" y2="466" />
    <line x1="46" y1="256" x2="56" y2="256" />
    <line x1="456" y1="256" x2="466" y2="256" />
    <!-- Diagonal ticks -->
    <line x1="107" y1="107" x2="114" y2="114" />
    <line x1="405" y1="107" x2="398" y2="114" />
    <line x1="107" y1="405" x2="114" y2="398" />
    <line x1="405" y1="405" x2="398" y2="398" />
  </g>

  <!-- Center CLI Prompt symbol (no text) -->
  <g filter="url(#neon-glow)">
    <!-- Prompt chevron '>' -->
    <path d="M 180 180 L 255 256 L 180 332" fill="none" stroke="#00ff66" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Terminal flashing cursor block '_' -->
    <rect x="280" y="310" width="60" height="22" rx="4" fill="#00ff66" />
  </g>
</svg>